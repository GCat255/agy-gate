<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agy CLI 用量</title>
    <style>
      :root {
        --bg: #111317;
        --elevated: #181b20;
        --fg: #eef1f5;
        --muted: #98a2b3;
        --border: rgba(255, 255, 255, 0.12);
        --primary: #3b82f6;
        --primary-fg: #ffffff;
        --success: #22c55e;
        --warning: #f59e0b;
        --error: #ef4444;
        --radius: 8px;
        --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        font-size: 13px;
        line-height: 1.5;
      }
      .wrap {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        background: var(--elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      .badge {
        font-size: 11px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge.ok { color: var(--success); border-color: color-mix(in srgb, var(--success) 45%, transparent); }
      .badge.warn { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 45%, transparent); }
      .badge.err { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); }
      .muted {
        color: var(--muted);
        font-size: 12px;
        margin: 0;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      button {
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        border-radius: calc(var(--radius) - 2px);
        padding: 7px 12px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        transition: opacity 0.15s ease;
      }
      button:hover:not(:disabled) { opacity: 0.88; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.primary {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: transparent;
      }
      button.danger {
        color: var(--error);
      }
      input[type="text"] {
        width: 100%;
        padding: 7px 10px;
        font-size: 12px;
        font-family: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 2px);
        outline: none;
      }
      .quota-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .quota-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
      }
      .bar-track {
        height: 6px;
        width: 100%;
        border-radius: 999px;
        background: var(--bg);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: var(--primary);
        border-radius: 999px;
        transition: width 0.2s ease;
      }
      .bar-fill.warn { background: var(--warning); }
      .bar-fill.err { background: var(--error); }
      .hidden { display: none !important; }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <div class="header">
          <h1 class="title">Agy CLI · Gemini 订阅用量</h1>
          <span id="status-badge" class="badge">检查中…</span>
        </div>
        <p id="account-desc" class="muted">
          使用扩展自带的独立 Google OAuth 只读拉取配额，不修改 OpenCode 配置或模型列表。
        </p>
        <div class="row">
          <button id="login-btn" class="primary">使用 Google 登录</button>
          <button id="refresh-btn" class="hidden">刷新用量</button>
          <button id="logout-btn" class="danger hidden">退出登录</button>
        </div>
        <div id="pending-box" class="hidden">
          <p class="muted" style="margin-bottom: 6px;">已在浏览器打开 Google 授权页；若未自动跳转，可复制链接或粘贴回调 URL：</p>
          <div class="row" style="margin-bottom: 8px;">
            <button id="open-url-btn">重新打开授权页</button>
            <button id="copy-url-btn">复制授权链接</button>
          </div>
          <div class="row" style="flex-wrap: nowrap;">
            <input id="manual-input" type="text" placeholder="可选：粘贴回调 URL 或授权码 code" />
            <button id="manual-submit-btn" style="white-space: nowrap;">提交</button>
          </div>
        </div>
        <p id="error-text" class="muted hidden" style="color: var(--error);"></p>
      </section>

      <section id="quota-card" class="card hidden">
        <div class="header">
          <h2 class="title">当前配额概览</h2>
          <span id="plan-badge" class="badge hidden"></span>
        </div>
        <div id="quota-list"></div>
        <p class="muted">
          可在 OpenChamber「设置 → 用量 → Agy CLI 用量」查看完整模型明细，并勾选显示在顶部状态栏。
        </p>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
